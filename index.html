<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hair Today, Gone Tomorrow</title>
<meta name="description" content="A before and after slider. Drag to see the difference.">
<style>
  :root {
    --bg: #0f0f12;
    --fg: #f4f1ea;
    --muted: #9a968c;
    --accent: #f4f1ea;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: Georgia, "Times New Roman", serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    padding: 24px 16px;
  }
  header { text-align: center; }
  h1 { font-size: clamp(1.6rem, 5vw, 2.4rem); font-weight: 400; letter-spacing: .01em; }
  header p { color: var(--muted); font-style: italic; margin-top: 6px; }

  .compare {
    position: relative;
    width: min(100%, 460px, calc((100vh - 190px) * 0.75));
    aspect-ratio: 3 / 4;
    border-radius: 14px;
    overflow: hidden;
    user-select: none;
    touch-action: pan-y;
    cursor: ew-resize;
    box-shadow: 0 20px 60px rgba(0,0,0,.55);
    --pos: 50%;
  }
  .compare img {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    pointer-events: none;
    -webkit-user-drag: none;
  }
  .after { clip-path: inset(0 0 0 var(--pos)); }

  .tag {
    position: absolute; top: 14px;
    padding: 5px 12px;
    font: 600 .75rem/1 system-ui, sans-serif;
    letter-spacing: .12em; text-transform: uppercase;
    background: rgba(15,15,18,.6);
    backdrop-filter: blur(6px);
    border-radius: 999px;
  }
  .tag.l { left: 14px; }
  .tag.r { right: 14px; }

  .handle {
    position: absolute; top: 0; bottom: 0;
    left: var(--pos);
    width: 2px; margin-left: -1px;
    background: var(--accent);
    pointer-events: none;
  }
  .handle::after {
    content: "\2194";
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 44px; height: 44px;
    display: grid; place-items: center;
    border-radius: 50%;
    background: var(--accent); color: var(--bg);
    font: 600 1.3rem/1 system-ui, sans-serif;
    box-shadow: 0 4px 16px rgba(0,0,0,.5);
  }

  /* Invisible range input gives free keyboard + screen reader support */
  .compare input {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    opacity: 0; cursor: ew-resize;
    margin: 0;
  }
  .compare:focus-within { outline: 2px solid var(--accent); outline-offset: 3px; }
</style>
</head>
<body>
  <header>
    <h1>Hair Today, Gone Tomorrow</h1>
    <p>Drag to see the transformation</p>
  </header>

  <div class="compare" id="compare">
    <img src="Assets/hair-aligned.jpg" alt="With hair" draggable="false">
    <img class="after" src="Assets/bald-aligned.jpg" alt="Bald" draggable="false">
    <span class="tag l">Hair</span>
    <span class="tag r">Bald</span>
    <div class="handle"></div>
    <input type="range" min="0" max="100" value="50" aria-label="Reveal slider: with hair versus bald" id="range">
  </div>

  <script>
    const box = document.getElementById('compare');
    const range = document.getElementById('range');
    const set = v => box.style.setProperty('--pos', v + '%');
    range.addEventListener('input', () => set(range.value));
    set(range.value);
  </script>
</body>
</html>
